<h1>DJI 4G Hub</h1>
<div class="subtitle">适用于 DJI Cellular Dongle 的 macOS 管理工具</div>

<p>
DJI 4G Hub 可让 DJI 第一代 4G 模块在 Mac 上同时提供移动网络、短信与来电监控等功能。
</p>

<ul>
    <li>4G / LTE 网络连接与流量监控</li>
    <li>短信读取与发送</li>
    <li>来电监控与拒接</li>
    <li>eSIM / 卡片管理</li>
    <li>USB 网络诊断与 AT 指令调试</li>
</ul>

<p>
安装程序将同时安装 DJI 4G Hub 应用程序及本地后台服务。
